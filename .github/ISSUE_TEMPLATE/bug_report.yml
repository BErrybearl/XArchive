name: 问题反馈 / Bug report
description: 报告 XArchive 的异常或错误。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴 Cookie、Token、登录文件或浏览器资料，也不要上传真实归档数据库。日志和截图请先删除个人信息及凭据。
        安全漏洞请按 SECURITY.md 的说明报告。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已确认以下内容及附件不含 Cookie、Token、登录文件和其他敏感信息。
          required: true
  - type: input
    id: version
    attributes:
      label: XArchive 版本
      placeholder: '例如：0.1.0；源码构建请填写提交编号。'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、便携 EXE 或源码构建；涉及登录时可补充浏览器版本。
      placeholder: Windows 11，便携 EXE
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不含真实凭据和个人数据的示例。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附脱敏后的错误信息、日志片段或截图。
    validations:
      required: true

name: 功能建议 / Feature request
description: 提出使用需求或改进建议。
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。请勿粘贴 Cookie、Token、登录文件、浏览器资料或真实归档数据库；截图与示例请先脱敏。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已确认以下内容及附件不含 Cookie、Token、登录文件和其他敏感信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 说明你希望解决的具体问题，以及目前的操作方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或改进
      description: 描述预期行为和结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏后的示例或截图。
